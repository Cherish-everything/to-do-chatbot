<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
</head>

<body>
    <div class="card">
        <h1 class="titles"> Login </h1>
        <hr>
        <div class="form-container">
            <form action="/login" method="POST">

                <div>
                    <span class="field-label">Username:</span>
                    <input class="input-field" type="text" name="username" required autocomplete="off">
                </div>

                <div>
                    <span class="field-label">Passcode:</span>
                    <input class="input-field" type="password" name="password" required>
                </div>
                <hr>
                <button class="submit" type="submit">LOGIN</button>
            </form>
            <a href="/register">No account yet?</a>
        </div>
    </div>
</body>

</html>
